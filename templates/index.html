<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Studio Pro</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="py-4">

  <div class="container-xl">
    <header class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
      <div class="d-flex align-items-center gap-3">
        <div class="bg-primary text-white p-2 rounded-3 d-flex align-items-center justify-content-center" style="width: 42px; height: 42px;">
          <i class="bi bi-stack fs-5"></i>
        </div>
        <div>
          <h5 class="mb-0 fw-bold">Document Studio</h5>
          <span class="text-secondary small">Lossless PDF & Image Processing Suite</span>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-secondary btn-sm px-3 d-flex align-items-center gap-2" id="themeToggleBtn">
          <i class="bi bi-sun-fill" id="themeIcon"></i>
          <span id="themeText">Light</span>
        </button>
      </div>
    </header>

    <div class="d-flex justify-content-center justify-content-md-start mb-3">
      <ul class="nav nav-tabs-custom" id="studioTabs" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#mergePane" type="button">
            <i class="bi bi-layers-half"></i>Merge Documents
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#convertPane" type="button">
            <i class="bi bi-arrow-left-right"></i>Conversion Hub
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#cropPane" type="button">
            <i class="bi bi-crop"></i>Smart Cropper
          </button>
        </li>
      </ul>
    </div>

    <div class="tab-content main-surface p-4 shadow-sm">
      <!-- 1. MERGE -->
      <div class="tab-pane fade show active" id="mergePane" role="tabpanel">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div class="d-flex flex-wrap align-items-center gap-2">
            <label class="btn btn-primary d-flex align-items-center gap-2 px-3">
              <i class="bi bi-cloud-arrow-up-fill"></i> Add Files
              <input type="file" id="mergeFileInput" multiple accept=".pdf,.png,.jpg,.jpeg,.bmp,.webp" hidden>
            </label>
            <button class="btn btn-outline-secondary btn-sm" onclick="toggleAll('mergeGrid', true)">Select All</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="toggleAll('mergeGrid', false)">Unselect All</button>
            <button class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1" onclick="deleteSelected('mergeGrid')">
              <i class="bi bi-trash3"></i> Delete Selected
            </button>
            <button class="btn btn-outline-secondary btn-sm" onclick="clearAll('mergeGrid')">Clear</button>
          </div>
          <div class="text-secondary small d-flex align-items-center gap-2">
            <i class="bi bi-info-circle"></i> Drag cards to reorder. Double-click to zoom.
          </div>
        </div>

        <div class="drop-zone mb-3" id="mergeDropZone">
          <i class="bi bi-files text-secondary fs-2 d-block mb-1"></i>
          <span class="fw-medium">Drag & drop PDF files or Images here</span>
          <span class="text-secondary d-block small">or click the "Add Files" button above</span>
        </div>

        <div id="mergeGrid" class="doc-card-grid p-2 mb-4"></div>

        <div class="border-top pt-3 row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label small text-secondary fw-semibold">Output Filename</label>
            <div class="input-group">
              <input type="text" id="mergeFilename" class="form-control" value="merged_studio_doc.pdf">
              <span class="input-group-text"><i class="bi bi-file-earmark-pdf"></i></span>
            </div>
          </div>
          <div class="col-md-3">
            <label class="form-label small text-secondary fw-semibold">Target Size (KB)</label>
            <input type="number" id="mergeTargetKb" class="form-control" placeholder="Lossless (blank)">
          </div>
          <div class="col-md-3 ms-auto">
            <button class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2" onclick="executeMerge()">
              <i class="bi bi-file-earmark-check-fill"></i> Merge Document
            </button>
          </div>
        </div>
      </div>

      <!-- 2. CONVERT -->
      <div class="tab-pane fade" id="convertPane" role="tabpanel">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div class="d-flex flex-wrap align-items-center gap-2">
            <select id="convertMode" class="form-select w-auto">
              <option value="pdf2img">PDF to Indexed Images (.zip)</option>
              <option value="img2pdf">Images to Unified PDF (.pdf)</option>
            </select>
            <label class="btn btn-primary d-flex align-items-center gap-2 px-3">
              <i class="bi bi-folder-plus"></i> Browse Files
              <input type="file" id="convertFileInput" multiple hidden>
            </label>
            <button class="btn btn-outline-danger btn-sm" onclick="deleteSelected('convertGrid')">Delete Selected</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="clearAll('convertGrid')">Clear</button>
          </div>
          <button class="btn btn-primary px-4 py-2 fw-semibold d-flex align-items-center gap-2" onclick="executeConversion()">
            <i class="bi bi-play-circle-fill"></i> Run Conversion
          </button>
        </div>

        <div class="drop-zone mb-3" id="convertDropZone">
          <i class="bi bi-arrow-repeat text-secondary fs-2 d-block mb-1"></i>
          <span class="fw-medium">Drag & drop files to convert</span>
        </div>

        <div id="convertGrid" class="doc-card-grid p-2"></div>
      </div>

      <!-- 3. CROP -->
      <div class="tab-pane fade" id="cropPane" role="tabpanel">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
          <div class="d-flex flex-wrap align-items-center gap-2">
            <label class="btn btn-primary d-flex align-items-center gap-2">
              <i class="bi bi-image"></i> Open Image
              <input type="file" id="cropFileInput" accept="image/*" hidden>
            </label>
            <div class="input-group input-group-sm w-auto">
              <span class="input-group-text bg-body-tertiary">W (px)</span>
              <input type="number" id="cropW" class="form-control" style="width: 85px;">
            </div>
            <div class="input-group input-group-sm w-auto">
              <span class="input-group-text bg-body-tertiary">H (px)</span>
              <input type="number" id="cropH" class="form-control" style="width: 85px;">
            </div>
            <button class="btn btn-outline-secondary btn-sm" onclick="applyFixedPx()">Set Px</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="if(cropper) cropper.reset()">Reset</button>
          </div>
          <button class="btn btn-success fw-semibold px-4 d-flex align-items-center gap-2" onclick="executeCrop()">
            <i class="bi bi-download"></i> Crop & Download
          </button>
        </div>

        <div class="cropper-stage-wrapper position-relative">
          <img id="cropImage" src="" alt="Cropper Canvas" style="max-width: 100%; display: none;">
          <div id="cropPlaceholder" class="text-secondary text-center p-5">
            <i class="bi bi-bounding-box-circles fs-1 d-block mb-2"></i>
            <span>Open an image to start interactive cropping</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="previewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-body border-0 shadow">
        <div class="modal-header border-bottom py-2">
          <span class="modal-title fw-semibold text-truncate" id="previewTitle">Document Preview</span>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center p-3" style="background-color: rgba(0,0,0,0.25);">
          <img id="previewModalImg" src="" style="max-height: 75vh; max-width: 100%; object-fit: contain; border-radius: 6px;">
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="actionToast" class="toast align-items-center text-bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toastMessage">Action completed.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

  <script>
    const themeBtn = document.getElementById('themeToggleBtn');
    themeBtn.addEventListener('click', () => {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-bs-theme') === 'dark';
      html.setAttribute('data-bs-theme', isDark ? 'light' : 'dark');
      document.getElementById('themeText').innerText = isDark ? 'Dark' : 'Light';
      document.getElementById('themeIcon').className = isDark ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
    });

    function showToast(msg, isError = false) {
      const toastEl = document.getElementById('actionToast');
      toastEl.className = `toast align-items-center text-bg-${isError ? 'danger' : 'primary'} border-0`;
      document.getElementById('toastMessage').innerText = msg;
      new bootstrap.Toast(toastEl).show();
    }

    new Sortable(document.getElementById('mergeGrid'), {
      animation: 200,
      ghostClass: 'sortable-ghost',
      delay: 50,
      delayOnTouchOnly: true
    });

    new Sortable(document.getElementById('convertGrid'), {
      animation: 200,
      ghostClass: 'sortable-ghost',
      delay: 50,
      delayOnTouchOnly: true
    });

    function setupDropZone(dropZoneId, fileInputId, targetGridId) {
      const dropZone = document.getElementById(dropZoneId);
      const fileInput = document.getElementById(fileInputId);

      dropZone.addEventListener('click', () => fileInput.click());
      
      ['dragenter', 'dragover'].forEach(name => {
        dropZone.addEventListener(name, (e) => {
          e.preventDefault();
          dropZone.classList.add('dragover');
        });
      });

      ['dragleave', 'drop'].forEach(name => {
        dropZone.addEventListener(name, (e) => {
          e.preventDefault();
          dropZone.classList.remove('dragover');
        });
      });

      dropZone.addEventListener('drop', (e) => {
        if (e.dataTransfer.files.length) {
          uploadFiles(e.dataTransfer.files, targetGridId);
        }
      });

      fileInput.addEventListener('change', (e) => {
        uploadFiles(e.target.files, targetGridId);
        e.target.value = '';
      });
    }

    setupDropZone('mergeDropZone', 'mergeFileInput', 'mergeGrid');
    setupDropZone('convertDropZone', 'convertFileInput', 'convertGrid');

    async function uploadFiles(files, targetGridId) {
      if (!files.length) return;
      const formData = new FormData();
      for (const f of files) formData.append('files', f);

      showToast('Processing documents...');
      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();
        const grid = document.getElementById(targetGridId);

        data.cards.forEach(card => {
          const el = document.createElement('div');
          el.className = 'doc-card selected';
          el.dataset.card = JSON.stringify(card);
          el.innerHTML = `
            <div class="preview-stage">
              ${card.preview ? `<img src="${card.preview}">` : `<i class="bi bi-file-earmark-pdf fs-1 text-secondary"></i>`}
            </div>
            <div class="card-footer-info">
              <input type="checkbox" class="card-checkbox" checked onclick="event.stopPropagation(); this.closest('.doc-card').classList.toggle('selected', this.checked)">
              <span class="small text-truncate fw-medium" title="${card.title}">${card.title}</span>
            </div>
          `;

          el.addEventListener('click', () => {
            const chk = el.querySelector('.card-checkbox');
            chk.checked = !chk.checked;
            el.classList.toggle('selected', chk.checked);
          });

          el.addEventListener('dblclick', () => {
            if (card.preview) {
              document.getElementById('previewTitle').innerText = card.title;
              document.getElementById('previewModalImg').src = card.preview;
              new bootstrap.Modal(document.getElementById('previewModal')).show();
            }
          });

          grid.appendChild(el);
        });

        showToast(`Loaded ${data.cards.length} document items.`);
      } catch (err) {
        showToast('Failed to upload files.', true);
      }
    }

    function toggleAll(gridId, state) {
      document.querySelectorAll(`#${gridId} .doc-card`).forEach(c => {
        c.querySelector('.card-checkbox').checked = state;
        c.classList.toggle('selected', state);
      });
    }

    function deleteSelected(gridId) {
      let count = 0;
      document.querySelectorAll(`#${gridId} .doc-card`).forEach(c => {
        if (c.querySelector('.card-checkbox').checked) {
          c.remove();
          count++;
        }
      });
      showToast(`Removed ${count} card(s).`);
    }

    function clearAll(gridId) {
      document.getElementById(gridId).innerHTML = '';
      showToast('Workspace cleared.');
    }

    function getSelectedCards(gridId) {
      const selected = [];
      document.querySelectorAll(`#${gridId} .doc-card`).forEach(c => {
        if (c.querySelector('.card-checkbox').checked) {
          selected.push(JSON.parse(c.dataset.card));
        }
      });
      return selected;
    }

    async function executeMerge() {
      const cards = getSelectedCards('mergeGrid');
      if (!cards.length) return showToast('Please select at least one document.', true);

      showToast('Merging and optimizing document...');
      const payload = {
        cards: cards,
        filename: document.getElementById('mergeFilename').value.trim(),
        target_kb: document.getElementById('mergeTargetKb').value.trim()
      };

      try {
        const res = await fetch('/api/merge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error();
        const blob = await res.blob();
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = payload.filename || 'merged_studio_doc.pdf';
        link.click();
        showToast('Document merged and downloaded successfully.');
      } catch (err) {
        showToast('Error merging document.', true);
      }
    }

    async function executeConversion() {
      const cards = getSelectedCards('convertGrid');
      if (!cards.length) return showToast('Please select cards to convert.', true);

      const mode = document.getElementById('convertMode').value;
      const endpoint = mode === 'pdf2img' ? '/api/convert/pdf-to-img' : '/api/convert/img-to-pdf';

      showToast('Executing conversion...');
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cards: cards })
        });

        if (!res.ok) throw new Error();
        const blob = await res.blob();
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = mode === 'pdf2img' ? 'extracted_images.zip' : 'converted_images.pdf';
        link.click();
        showToast('Conversion complete. File downloaded.');
      } catch (err) {
        showToast('Conversion process failed.', true);
      }
    }

    let cropper = null;
    let originalRawB64 = '';

    document.getElementById('cropFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = document.getElementById('cropImage');
        img.src = event.target.result;
        img.style.display = 'block';
        document.getElementById('cropPlaceholder').style.display = 'none';

        originalRawB64 = event.target.result.split(',')[1];

        if (cropper) cropper.destroy();
        cropper = new Cropper(img, {
          viewMode: 1,
          autoCrop: true,
          crop(event) {
            document.getElementById('cropW').value = Math.round(event.detail.width);
            document.getElementById('cropH').value = Math.round(event.detail.height);
          }
        });
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    function applyFixedPx() {
      if (!cropper) return;
      const w = parseInt(document.getElementById('cropW').value);
      const h = parseInt(document.getElementById('cropH').value);
      if (w > 0 && h > 0) {
        const current = cropper.getData();
        cropper.setData({ ...current, width: w, height: h });
      }
    }

    async function executeCrop() {
      if (!cropper) return showToast('Please load an image to crop.', true);
      const data = cropper.getData(true);

      showToast('Cropping image losslessly...');
      try {
        const res = await fetch('/api/crop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image_data: originalRawB64,
            coords: data
          })
        });

        if (!res.ok) throw new Error();
        const blob = await res.blob();
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'cropped_studio_image.png';
        link.click();
        showToast('Image cropped and downloaded.');
      } catch (err) {
        showToast('Cropping failed.', true);
      }
    }
  </script>
</body>
</html>
